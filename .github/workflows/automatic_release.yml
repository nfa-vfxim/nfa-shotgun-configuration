name: Automatic release main to release branches
on:
  push:
    branches:
      - main
  workflow_dispatch:

# Every release branch is main plus its own core/roots.yml (the storage of
# that year). main itself has no roots.yml, so never merge a release branch
# back into main: make changes on main and let this workflow release them.
jobs:
  nfa-release-shotgrid-config:
    timeout-minutes: 2
    runs-on: ubuntu-latest
    strategy:
      # A conflict on one branch must not stop the other branches.
      fail-fast: false
      matrix:
        release: [s4, s3, s2]
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set Git config
      run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "Github Actions"

    - name: Release main to ${{ matrix.release }}
      run: |
          git checkout release/${{ matrix.release }}
          git merge --no-ff origin/main -m "Automatic merge main for release ${{ matrix.release }}"
          git push origin release/${{ matrix.release }}
