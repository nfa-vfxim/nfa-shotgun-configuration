# 3DEqualizer 4 (tk-3de4) templates - NFA

paths:
  ##########################################################################################
  # Shot level paths
  #

  # define the location of a work area
  shot_work_area_3de:
    definition: "@shot_root/3de"
  # define the location of a publish area
  shot_publish_area_3de:
    definition: "@shot_publish/3de"
  # The location of WIP files
  tde4_shot_work:
    definition: "@shot_root/3de/{Projectcode}_sc{Sequence}_{Shot}_{Step}_work_{name}_v{version}.3de"
  # The location of published 3DE files
  tde4_shot_publish:
    definition: "@shot_publish/3de/{Projectcode}_sc{Sequence}_{Shot}_{Step}_pub_{name}_v{version}.3de"

  ##########################################################################################
  # Asset level paths
  #

  asset_work_area_3de:
    definition: "@asset_root/3de"
  asset_publish_area_3de:
    definition: "@asset_publish/3de"
  tde4_asset_work:
    definition: "@asset_root/3de/{Projectcode}_{Asset}_{Step}_work_{name}_v{version}.3de"
  tde4_asset_publish:
    definition: "@asset_publish/3de/{Projectcode}_{Asset}_{Step}_pub_{name}_v{version}.3de"
